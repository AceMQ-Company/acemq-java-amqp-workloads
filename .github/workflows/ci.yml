# Build and test on every JDK this tool promises to run on.
#
# `verify` rather than `test`: the integration tests drive a real broker, and
# this is a load generator -- the parts worth trusting are the ones that only
# appear when messages are actually moving. ubuntu-latest has Docker.
#
# The benchmarks this tool produces are not run here and should not be. A hosted
# runner shares a CPU with the broker it is measuring, so any throughput number
# from CI describes the runner. What CI checks is that the tool works, not what
# it measures.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the baseline and the minimum toolchain; 21 and 25 are what
        # estates actually run.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify the CLI jar starts and reports its usage
        if: matrix.java == '17'
        # A shaded jar that builds and cannot start is a jar that fails in front
        # of a customer instead of here. --help exercises the manifest, the
        # shading, and the argument parser in one line.
        run: |
          # The CLI jar moved into library/ when the studio became a second
          # module. Its coordinates did not change; only where it is built.
          test -f library/target/acemq-workload.jar
          java -jar library/target/acemq-workload.jar --help

      - name: Verify the studio jar starts and serves the interface
        if: matrix.java == '17'
        # The same argument as the CLI check, for a jar that has more to go
        # wrong: a Spring context that will not start, a front end that was
        # never built into it, an SQLite driver that is not on the path. All
        # three are silent until somebody opens a browser.
        run: |
          test -f studio/target/acemq-workloads-studio.jar
          ACEMQ_STUDIO_DATABASE="$RUNNER_TEMP/studio-ci.db" \
            java -jar studio/target/acemq-workloads-studio.jar &
          studio=$!
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8480/actuator/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fs http://localhost:8480/actuator/health
          # The front end is in the jar, not merely built beside it.
          curl -fs http://localhost:8480/ | grep -q "AceMQ workloads studio"
          # And the API answers, which means the context came up whole.
          curl -fs http://localhost:8480/api/presets | grep -q quorum-vs-classic
          kill $studio

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  # The interface, in a real browser, against a real broker.
  #
  # Separate from `build` because it needs a jar, a broker and a browser, and
  # because the matrix would run it three times to learn the same thing. The
  # component tests in jsdom are part of the Maven build and run on all three
  # JDKs; this is the layer that catches what jsdom cannot see, which is
  # everything to do with layout.
  ui:
    name: the interface, in a browser
    runs-on: ubuntu-latest
    services:
      broker:
        image: rabbitmq:4-alpine
        ports: ['5679:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the end-to-end tests
        run: ./scripts/e2e.sh amqp://guest:guest@localhost:5679
        env:
          CI: 'true'
          E2E_REBUILD: '1'

      # The run that failed is the one worth looking at, and a trace is the whole
      # story: every step, the DOM at each one, and a screenshot.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            studio/src/main/frontend/playwright-report/**
            studio/src/main/frontend/test-results/**
          retention-days: 7

  notify:
    needs: [build, ui]
    # Only when main breaks, and only on main -- a failing pull request is
    # already in front of the person who wrote it.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (needs.build.result == 'failure' || needs.ui.result == 'failure')
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: failure
      title: "AceMQ AMQP workloads: main is failing"
      message: "The build on main did not pass. Artifacts from it should not be trusted."
      # Work in progress rather than a dead build. main breaking is somebody's
      # next job, not an outage, and a red dot in a channel that also carries
      # release failures makes the two look alike.
      icon: ":construction:"
      url: https://github.com/AceMQ-Company/acemq-java-amqp-workloads/actions/workflows/ci.yml
    secrets:
      # Explicit, not `inherit`. A reusable workflow in another repository
      # does not receive inherited secrets, so `inherit` here produced a
      # notify job that went green while sending nothing at all -- the
      # shared workflow treats a missing webhook as "nothing to notify"
      # and succeeds, by design, so the silence looked like health.
      SLACK_DELIVERY_WEBHOOK: ${{ secrets.SLACK_DELIVERY_WEBHOOK }}
