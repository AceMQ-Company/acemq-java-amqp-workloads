# Build and test on every JDK this tool promises to run on.
#
# `verify` rather than `test`: the integration tests drive a real broker, and
# this is a load generator -- the parts worth trusting are the ones that only
# appear when messages are actually moving. ubuntu-latest has Docker.
#
# The benchmarks this tool produces are not run here and should not be. A hosted
# runner shares a CPU with the broker it is measuring, so any throughput number
# from CI describes the runner. What CI checks is that the tool works, not what
# it measures.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Both libraries this tool measures can release without a commit landing here,
  # so the workflow also runs on a timer. A scheduled run is the only thing that
  # notices a release moving underneath an untouched repository, and this
  # repository went five minor versions without noticing.
  schedule:
    - cron: '35 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the baseline and the minimum toolchain; 21 and 25 are what
        # estates actually run.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Check nothing skipped
        # A suite that skipped everything reports the same green as one that
        # passed everything, and the step above cannot tell the two apart. This
        # reads the Surefire and Failsafe XML and fails on any skip nobody wrote
        # an exemption for.
        #
        # Here as well as in release.yml, on purpose. The release is the moment
        # it matters, but a gate that only ever runs at release time is a gate
        # whose first real exercise is the thing it is meant to protect, and on
        # all three JDKs an @Disabled somebody added is visible in the pull
        # request that added it rather than a fortnight later.
        #
        # Without --require-integration, which release.yml passes: this job is
        # where a JDK-specific gap would first show up, and failing three CI runs
        # to learn that is a worse way to find out than failing one release.
        run: python3 etc/check-nothing-skipped.py .

      - name: Verify the CLI jar starts and reports its usage
        if: matrix.java == '17'
        # A shaded jar that builds and cannot start is a jar that fails in front
        # of a customer instead of here. --help exercises the manifest, the
        # shading, and the argument parser in one line.
        run: |
          # The CLI jar moved into library/ when the studio became a second
          # module. Its coordinates did not change; only where it is built.
          test -f library/target/acemq-workload.jar
          java -jar library/target/acemq-workload.jar --help

      - name: Verify the studio jar starts and serves the interface
        if: matrix.java == '17'
        # The same argument as the CLI check, for a jar that has more to go
        # wrong: a Spring context that will not start, a front end that was
        # never built into it, an SQLite driver that is not on the path. All
        # three are silent until somebody opens a browser.
        run: |
          test -f studio/target/acemq-workloads-studio.jar
          ACEMQ_STUDIO_DATABASE="$RUNNER_TEMP/studio-ci.db" \
            java -jar studio/target/acemq-workloads-studio.jar &
          studio=$!
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8480/actuator/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fs http://localhost:8480/actuator/health
          # The front end is in the jar, not merely built beside it.
          curl -fs http://localhost:8480/ | grep -q "AceMQ workloads studio"
          # And the API answers, which means the context came up whole.
          curl -fs http://localhost:8480/api/presets | grep -q quorum-vs-classic
          kill $studio

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  # The interface, in a real browser, against a real broker.
  #
  # Separate from `build` because it needs a jar, a broker and a browser, and
  # because the matrix would run it three times to learn the same thing. The
  # component tests in jsdom are part of the Maven build and run on all three
  # JDKs; this is the layer that catches what jsdom cannot see, which is
  # everything to do with layout.
  ui:
    name: the interface, in a browser
    runs-on: ubuntu-latest
    services:
      broker:
        image: rabbitmq:4-alpine
        ports: ['5679:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the end-to-end tests
        run: ./scripts/e2e.sh amqp://guest:guest@localhost:5679
        env:
          CI: 'true'
          E2E_REBUILD: '1'

      # The run that failed is the one worth looking at, and a trace is the whole
      # story: every step, the DOM at each one, and a screenshot.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            studio/src/main/frontend/playwright-report/**
            studio/src/main/frontend/test-results/**
          retention-days: 7

  tracks-the-release:
    name: the pins are the newest releases
    runs-on: ubuntu-latest
    # A job of its own rather than a step inside `build`, deliberately. A stale
    # pin and a broken build are different findings and both are worth having:
    # everything above still compiles and still runs whatever this job concludes,
    # so a red X here reads as "the pinned library is old", never as "we have no
    # idea whether any of this works".
    #
    # This repository is where a stale pin does its quietest damage. A benchmark
    # is believed. <acemq.version> sat at 0.2.10 while acemq-java-amqp was at
    # 0.7.3, which means every throughput and latency number this tool produced
    # over that period described a library five releases old while the report
    # header said nothing about it. The measurement was not wrong so much as
    # about the wrong thing, and nothing in a green build said so.
    steps:
      - uses: actions/checkout@v4

      - name: Both pinned libraries are the newest released ones
        # Hard failure rather than a warning, for the reason the examples
        # repositories give: a warning in a log is what let the pin fall five
        # minor versions behind. A green build is read as an answer.
        #
        # Both properties are checked in one pass and both are reported before the
        # step exits, so a second stale pin cannot hide behind the first. That is
        # not hypothetical here -- acemq.version and acemq.admin.version move for
        # different reasons on different version lines, and fixing one is no
        # evidence about the other.
        #
        # The tags are asked of each library repository rather than of the Maven
        # feed: git ls-remote needs no token, which matters on a scheduled run,
        # and the tag is what the release was cut from.
        run: |
          pom=library/pom.xml
          fail=0

          check() {
            property="$1"
            repo="$2"
            # The dots in the property name are regex metacharacters, and an
            # unescaped one would let <acemqXversion> match. Escaped here rather
            # than at the call site so the name stays readable in the messages.
            escaped=$(printf '%s' "$property" | sed 's/\./\\./g')

            pinned=$(sed -n "s/.*<$escaped>\(.*\)<\/$escaped>.*/\1/p" "$pom" | head -1)
            newest=$(git ls-remote --tags "https://github.com/AceMQ-Company/$repo" \
                       | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                       | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                       | sort -V | tail -1)

            # An empty answer means the listing failed or the tag naming changed,
            # and comparing against nothing would pass silently forever.
            if [ -z "$newest" ]; then
              echo "::error::no release tags found on $repo, so <$property> could not be checked"
              fail=1
              return
            fi
            if [ -z "$pinned" ]; then
              echo "::error::no <$property> found in $pom, so the pin on $repo could not be checked"
              fail=1
              return
            fi

            if [ "$pinned" != "$newest" ]; then
              echo "::error::$pom pins $repo $pinned but the newest release is $newest. Edit <$property> in $pom and set it to $newest, then re-run the workloads against it -- any measurement taken at $pinned describes the older library."
              fail=1
              return
            fi
            echo "pinned $repo $pinned, which is the newest release"
          }

          check acemq.version       acemq-java-amqp
          check acemq.admin.version acemq-java-rabbitmq-admin

          exit $fail

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
