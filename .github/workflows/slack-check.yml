# Temporary: proves this repository can reach Slack through the shared workflow.
# Deleted immediately after it has run once.
name: slack-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: success
      title: "Slack wiring verified"
      message: "This repository can post to the channel. Sent once to confirm the webhook, then the workflow that sent it was deleted."
      icon: ":satellite_antenna:"
    secrets: inherit
