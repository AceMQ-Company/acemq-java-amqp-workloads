# A gate. This is the file a pipeline runs, and the shape most of these examples
# are practice for.
#
#   java -jar library/target/acemq-workload.jar -f examples/12-ci-gate.yaml \
#     --report "$RUNNER_TEMP/perf" --format html,json --quiet
#
#   case $? in
#     0) ;;                                            # ship it
#     1) echo "the broker did not meet the objective"; exit 1 ;;
#     2) echo "the harness could not offer the load";  exit 1 ;;
#     3) echo "this file is wrong";                    exit 1 ;;
#     4) echo "could not reach the broker";            exit 1 ;;
#   esac
#
# Upload the report on `always()`. The run you most want to look at is the one
# that failed, and a gate that discards the evidence of its own failure makes
# people turn it off.
#
# Four things make a gate one people keep rather than delete.
#
# **Objectives from the promise, not from yesterday's run.** 5,000/s and 100ms
# are what the service says it does. A threshold copied from the last green run
# ratchets down every time the runner is busy, and by March it certifies
# nothing. If you do not have a promise to copy, that is the finding — go and
# get one before writing a number here.
#
# **Long enough to be a measurement.** Two minutes, not thirty seconds. A short
# run measures JIT, connection setup and the first collection alongside the
# broker, and the `run-was-long-enough` warning exists because people reach for
# thirty seconds when the pipeline feels slow.
#
# **Headroom in the generator, not in the objective.** `threads: 8` and
# `maxInFlight: 2000` are there so the client is never the thing that fails.
# A gate whose generator cannot keep up exits 2, which is noise, and noise is
# what gets a gate switched off.
#
# **Headroom in the consumers too, and this is the one people miss.** Sixteen
# consumers with a 1ms handler can finish about 16,000 a second, against 5,000
# offered. Set them to eight and the arithmetic says 8,000, which sounds like
# ample headroom over 5,000 and is not — scheduling, acknowledgement and the
# broker's own delivery cost eat the difference, the queue starts growing, and
# end-to-end latency becomes a function of how long the gate ran. The first
# version of this file had `concurrency: 8` against `rate: 8000` and failed on
# every objective at once for exactly that reason, which is how it came to say
# so here.
#
# The password comes from the environment. A workload file is meant to be
# committed and reviewed — that is most of its value — and an unset variable
# with no default is an error here rather than an empty password.
name: ci-gate
broker: amqp://${BROKER_USER:-guest}:${BROKER_PASSWORD:-guest}@localhost:5672
management: http://localhost:15672

topology:
  exchange: ex.gate
  exchangeType: topic
  queue: ex.gate.orders
  routingKey: order.created
  # No `queueType` here, deliberately: on this build a workload file's
  # `queueType` is dropped on the way to the broker and the queue is declared
  # classic whatever it says, while the report prints back the type you asked
  # for. A gate that believes it is testing a quorum queue and is not, is worse
  # than one that knows it is testing a classic queue. Gate a quorum queue with
  # a scenario file, as 05 does.
  #
  # Against a real environment set `declare: false`. Declaring would either be
  # refused for mismatched arguments or, worse, quietly create something subtly
  # different from what production runs and measure that instead.
  declare: true

publishers:
  threads: 8
  rate: 5000
  messageSize: 1024
  confirms: true
  maxInFlight: 2000

consumers:
  concurrency: 16
  prefetch: 200
  # A millisecond of simulated work, because a consumer that does nothing
  # measures the broker and a consumer that takes a millisecond measures the
  # broker and the application. Almost every real system lives in the second
  # case, and a gate built on the first one passes right up until it matters.
  handlerTime: 1ms

warmup: 15s
runFor: 2m

expect:
  # What was consumed, not what was published. A publish rate the consumers
  # never matched is a queue filling up rather than a system running.
  throughputAtLeast: 4800
  p99Below: 100ms
  p999Below: 500ms
  # `noMessagesLost` is left out on purpose — see the note in 02. In a gate,
  # an objective that fails half the time for a reason that is not the broker
  # is worse than no objective at all.
